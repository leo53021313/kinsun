<text x="306" y="6" font-size="10" font-weight="400" fill="#5F6368" text-anchor="end">9:41</text>
<rect x="0" y="25" width="320" height="63" rx="0" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="14" y="40" font-size="23" font-weight="700" fill="#202124" text-anchor="start">長輩裝置綁定</text>
<text x="14" y="68" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">320px＋大字級檢查</text>
<text x="306" y="68" font-size="12" font-weight="400" fill="#5F6368" text-anchor="end">長輩</text>
