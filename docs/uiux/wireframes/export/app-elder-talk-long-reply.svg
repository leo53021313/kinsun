<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img">
<style>text{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Noto Sans TC',sans-serif;fill:#202124;}.muted{fill:#5F6368}.label{font-weight:700;letter-spacing:.4px}</style>
<rect x="0" y="0" width="390" height="25" rx="0" fill="#F1F3F4" stroke="#DADCE0" stroke-width="1"/>
<text x="18" y="6" font-size="10" font-weight="400" fill="#5F6368" text-anchor="start">安全區域</text>
<text x="372" y="6" font-size="10" font-weight="400" fill="#5F6368" text-anchor="end">9:41</text>
<rect x="0" y="25" width="390" height="63" rx="0" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="18" y="40" font-size="20" font-weight="700" fill="#202124" text-anchor="start">陪伴對話</text>
<text x="18" y="68" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">長回覆可捲動</text>
<text x="372" y="68" font-size="12" font-weight="400" fill="#5F6368" text-anchor="end">長輩</text>
<rect x="8" y="96" width="374" height="710" rx="6" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="7 5"/>
<text x="18" y="100" font-size="10" font-weight="400" fill="#5F6368" text-anchor="start">可捲動內容</text>
<text x="18" y="122" font-size="22" font-weight="700" fill="#202124" text-anchor="start">阿金的回答</text>
<text x="18" y="162" font-size="16" font-weight="400" fill="#202124" text-anchor="start">你剛才提到最近晚上比較不好睡，也常常起床</text>
<text x="18" y="185" font-size="16" font-weight="400" fill="#202124" text-anchor="start">上廁所。今天先把水分分散到白天補充，睡前</text>
<text x="18" y="208" font-size="16" font-weight="400" fill="#202124" text-anchor="start">不要一次喝太多。</text>
<text x="18" y="241" font-size="16" font-weight="400" fill="#202124" text-anchor="start">如果連續幾天都睡不好，或起身時覺得暈，記</text>
<text x="18" y="264" font-size="16" font-weight="400" fill="#202124" text-anchor="start">得告訴家人，一起安排看醫師。</text>
<text x="18" y="297" font-size="16" font-weight="400" fill="#202124" text-anchor="start">你可以再按住或短按麥克風，告訴我現在的感</text>
<text x="18" y="320" font-size="16" font-weight="400" fill="#202124" text-anchor="start">覺。</text>
<rect x="18" y="353" width="354" height="68" rx="10" fill="#E6E6E6" stroke="#3C4043" stroke-width="2" stroke-dasharray="7 5"/>
<text x="30" y="363" font-size="12" font-weight="700" fill="#5F6368" text-anchor="start">設計註記</text>
<text x="30" y="383" font-size="15" font-weight="400" fill="#202124" text-anchor="start">文字區可捲動；麥克風與安全區域固定</text>
<text x="18" y="825" font-size="10" font-weight="400" fill="#5F6368" text-anchor="start">底部安全區域</text>
</svg>