[project]
name = "kinsun"
version = "0.1.0"
description = "聽懂國台語的長輩 AI 語音陪伴守護 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "croniter>=6.2.2",
    "en-core-web-sm",
    "fastapi>=0.138.1",
    "google-genai>=2.10.0",
    "httpx>=0.28.1",
    "line-bot-sdk>=3",
    "mem0ai[nlp]>=2.0.10",
    "opik>=2.1,<3",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.14.2",
    # 下限釘在 6.15.0：6.14.2 有 CVE-2026-71852／CVE-2026-71870（pip-audit 於
    # 2026-08-09 開始擋）。只鎖 uv.lock 擋不住重新解析時又掉回舊版，故一併抬下限。
    "pypdf>=6.15.0",
    "tenacity>=9.1.4",
    "tzdata>=2026.2",
    "uvicorn>=0.49.0",
    "vecs>=0.4.5",
]

# 本專案為應用程式（非套件），不需被建置安裝；uv 只負責管理依賴與虛擬環境。

[tool.ruff]
line-length = 100
target-version = "py312"
# 封存區不受現行品質閘門管轄：`docs/archive/` 放的是「當時長這樣」的快照
# （如 transport_agent 原型），刻意不隨規範演進而改寫——改了它就不是那份快照了。
# ⚠️ CI 跑的是 `ruff check .`／`ruff format --check .`（全庫無參數），沒有這一行
# 封存進來的舊程式碼會直接把 CI 弄紅。
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort(import 排序),
# B: bugbear(常見陷阱), UP: pyupgrade(語法現代化)
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 慣用法：Depends/Header 於參數預設值屬框架 DI，非 B008 想抓的陷阱。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 採 src layout：把 src 加入匯入路徑，讓測試可直接 import kinsun（本專案非套件、不安裝）。
# 加入專案根目錄，讓測試可 import tests.fakes（共用測試替身）。
pythonpath = ["src", "."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
