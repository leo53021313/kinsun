[project]
name = "kinsun"
version = "0.1.0"
description = "聽懂國台語的長輩 AI 語音陪伴守護 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "croniter>=6.2.2",
    "en-core-web-sm",
    "fastapi>=0.138.1",
    "google-genai>=2.10.0",
    "line-bot-sdk>=3",
    "mem0ai[nlp]>=2.0.10",
    "opik>=2.1,<3",
    "psycopg[binary,pool]>=3.3.4",
    "pypdf>=6.14.2",
    "tzdata>=2026.2",
    "uvicorn>=0.49.0",
    "vecs>=0.4.5",
]

# 本專案為應用程式（非套件），不需被建置安裝；uv 只負責管理依賴與虛擬環境。

[tool.ruff]
line-length = 100
target-version = "py312"
# transport_agent 為尚未接線的獨立原型（台北交通 AI 助理，自帶 Flask/HTML），
# 暫不納入主程式碼的 lint/format 品質閘門；待日後正式接線重構時再移除本排除。
extend-exclude = ["src/kinsun/tools/transport_agent"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort(import 排序),
# B: bugbear(常見陷阱), UP: pyupgrade(語法現代化)
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 慣用法：Depends/Header 於參數預設值屬框架 DI，非 B008 想抓的陷阱。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 採 src layout：把 src 加入匯入路徑，讓測試可直接 import kinsun（本專案非套件、不安裝）。
# 加入專案根目錄，讓測試可 import tests.fakes（共用測試替身）。
pythonpath = ["src", "."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
