name: CI

# 7 人協作的守門（戊-1）：每個對 main 的 PR（與合進 main 後）自動跑
# lint、格式、單元測試、Pg 合約測試（service container 起拋棄式 pgvector，
# 不碰正式庫，✅ D-69）、三端型別檢查與建置，外加依賴安全掃描。
# 單元測試全離線、不需雲端金鑰；KINSUN_IT 只閘 Pg 真庫測試，由 integration job 供庫。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # 允許在個人分支上手動驗證 CI 本身的修改

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 uv（含快取）
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 建立環境（依 uv.lock 還原，Python 由 .python-version 決定）
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff 格式檢查
        run: uv run ruff format --check .

      - name: 跑測試（含覆蓋率門檻 80%）
        run: uv run pytest --cov=kinsun --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 與本機拋棄式測試庫同一 image（見 CONTEXT.md 合約測試）；schema 由
        # pg_database fixture 的 ensure_schema 自動建立。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: kinsun-test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 uv（含快取）
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 建立環境（依 uv.lock 還原）
        run: uv sync --frozen

      - name: 跑測試（含 Pg 合約測試）
        run: uv run pytest
        env:
          KINSUN_IT: "1"
          KINSUN_TEST_DATABASE_URL: postgresql://postgres:kinsun-test@localhost:5433/postgres

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝前端依賴
        run: npm ci
        working-directory: frontend

      - name: 型別檢查
        run: npm run typecheck
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: 測試
        run: npm test
        working-directory: frontend

      - name: 建置
        run: npm run build
        working-directory: frontend

      - name: 建置觀測後台
        run: npm run build:admin
        working-directory: frontend

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安裝 App 依賴（kinsun-shared 走 file:../shared，需整庫 checkout）
        run: npm ci
        working-directory: app

      - name: 型別檢查
        run: npm run typecheck
        working-directory: app

      - name: Lint
        run: npm run lint
        working-directory: app

      - name: 測試
        run: npm test
        working-directory: app

      # 阿白角色的三道一致性閘門（2026-08-12 接進 CI）。它在 PR #106 就寫好了，卻
      # 沒有任何自動流程會跑到——只有人記得手動下 `npm run bear:check` 才會執行，
      # 而它守的三件事都是「壞掉不會有編譯錯誤、只有長輩看得出來」那一類：
      #   1. 兩份 renderer.html 產物（app/assets 與 web/public，各 3MB）與來源一致
      #      ——兩端打包器各要一份，來源只有一份，漂掉的症狀是「App 的阿白跟網頁的
      #      阿白動作不一樣」。
      #   2. `theme.ts` 的 emotionPolicy.blocked 與 renderer 的 BLOCKED_EMOTIONS
      #      是同一份——那是接手指示第 10 條、CRITICAL 等級，擋的是「長輩罵阿白時
      #      阿白生氣」。寫錯不會有任何症狀，直到那一刻。
      #   3. 人設措辭與離線邊界。
      - name: 阿白角色一致性閘門
        run: npm run bear:check
        working-directory: app

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安裝網頁版依賴
        run: npm ci
        working-directory: web

      - name: 型別檢查
        run: npm run typecheck
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: 測試
        run: npm test
        working-directory: web

      - name: 建置
        run: npm run build
        working-directory: web

  audit:
    # 依賴安全掃描：警示不擋門（continue-on-error）——新揭露的 CVE 不應在
    # 發表前夕擋死所有合併，但每次 PR 都看得到紅字、需人為決定處置。
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v5

      - name: pip-audit（Python 依賴）
        run: |
          uv export --frozen --no-emit-project -o requirements.txt
          uvx pip-audit --disable-pip -r requirements.txt

      - name: npm audit（frontend）
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: npm audit（app）
        run: npm audit --audit-level=high
        working-directory: app

      - name: npm audit（網頁版）
        run: npm audit --audit-level=high
        working-directory: web
